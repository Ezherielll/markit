      <rect x="38" y="269" width="260" height="8" rx="4" fill="#DDEFF9"/>
      <rect x="38" y="292" width="224" height="8" rx="4" fill="#DDEFF9"/>

      <text x="38" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="750" fill="#1677C8">- structured text</text>
      <text x="38" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="750" fill="#1677C8">- clean Markdown</text>

      <rect x="38" y="407" width="128" height="8" rx="4" fill="#A9DBFF"/>
      <rect x="178" y="407" width="82" height="8" rx="4" fill="#DDEFF9"/>
