<svg width="1600" height="840" viewBox="0 0 1600 840" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F9FF"/>
    </linearGradient>
    <linearGradient id="blue" x1="1110" y1="150" x2="1450" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDF1FF"/>
      <stop offset="1" stop-color="#A9DBFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="940" y1="330" x2="1320" y2="560" gradientUnits="userSpaceOnUse">
