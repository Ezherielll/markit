      <path d="M48 20V29H57" stroke="#A9DBFF" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <text x="96" y="54" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="750" fill="#102A43" letter-spacing="-2">MarkIt</text>

    <text x="0" y="166" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="750" fill="#102A43" letter-spacing="-1.6">
      Documents → Markdown
    </text>
    <text x="0" y="220" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="750" fill="#1677C8" letter-spacing="-1.6">
      locally. Simply.
    </text>

    <text x="0" y="286" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="450" fill="#486581">
      Fast, private, 100% offline document conversion for
    </text>
    <text x="0" y="322" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="450" fill="#486581">
      desktop and web — built with Flutter.
    </text>

    <!-- Tags -->
    <g transform="translate(0 374)">
      <rect width="148" height="44" rx="22" fill="#E6F4FF" stroke="#B9DDF6"/>
      <circle cx="23" cy="22" r="6" fill="#1677C8"/>
      <text x="40" y="29" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#145A91">100% Offline</text>

