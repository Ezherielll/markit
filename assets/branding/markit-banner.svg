      <path d="M22 20H49C54.5228 20 59 24.4772 59 30V54C59 59.5228 54.5228 64 49 64H25C20.0294 64 16 59.9706 16 55V26C16 22.6863 18.6863 20 22 20Z" fill="white" opacity="0.98"/>
