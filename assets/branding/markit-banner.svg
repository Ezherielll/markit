      <path d="M350 15V29M343 22H357" stroke="#1677C8" stroke-width="3" stroke-linecap="round"/>
      <text x="369" y="29" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#145A91">Open Source</text>
