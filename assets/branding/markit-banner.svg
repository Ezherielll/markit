    <g transform="translate(1285 120)">
      <rect width="205" height="52" rx="26" fill="white" stroke="#B9DDF6" stroke-width="2"/>
      <circle cx="31" cy="26" r="14" fill="#E6F4FF"/>
      <path d="M23 26H39M26 20C30 24 30 28 26 32M36 20C32 24 32 28 36 32" stroke="#1677C8" stroke-width="2.4" stroke-linecap="round"/>
