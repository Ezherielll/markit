      <path d="M186 14L181 22L186 30L194 22L186 14Z" fill="#2F9BEF"/>
      <text x="207" y="29" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#145A91">Flutter</text>

