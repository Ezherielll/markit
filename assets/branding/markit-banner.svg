  <path d="M0 690C260 590 410 760 700 680C930 617 1080 610 1290 720C1420 790 1500 792 1600 760V840H0V690Z" fill="#F0F8FF"/>
  <rect x="1030" y="80" width="500" height="650" rx="36" fill="url(#grid)" opacity="0.55"/>

  <!-- Left content -->
  <g transform="translate(120 132)">
