      <rect x="0" y="0" width="350" height="72" rx="26" fill="#E6F4FF"/>
      <rect x="0" y="48" width="350" height="24" fill="#E6F4FF"/>
      <circle cx="34" cy="36" r="7" fill="#2F9BEF"/>
