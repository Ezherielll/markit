      <rect x="42" y="184" width="148" height="13" rx="6.5" fill="#A9DBFF"/>
      <rect x="42" y="226" width="242" height="9" rx="4.5" fill="#DCEFFB"/>
      <rect x="42" y="251" width="228" height="9" rx="4.5" fill="#DCEFFB"/>
      <rect x="42" y="276" width="204" height="9" rx="4.5" fill="#DCEFFB"/>
      <rect x="42" y="320" width="126" height="13" rx="6.5" fill="#A9DBFF"/>
      <rect x="42" y="362" width="242" height="9" rx="4.5" fill="#DCEFFB"/>
      <rect x="42" y="387" width="190" height="9" rx="4.5" fill="#DCEFFB"/>
