<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Convert documents to clean, structured Markdown — fast, private, 100% offline. No uploads, no cloud: everything runs in your browser.">
  <meta name="theme-color" content="#274C8A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MarkIt">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MarkIt — Documents to Markdown</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Splash sederhana selama Flutter + pdfium.wasm (≈5 MB) dimuat. */
    html, body {
      margin: 0;
      height: 100%;
      background: #F6F4EF;
    }
    #markit-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: "Georgia", "Times New Roman", serif;
      color: #211F1C;
      transition: opacity 0.3s ease;
    }
    #markit-splash.hidden { opacity: 0; pointer-events: none; }
    #markit-splash .wordmark { font-size: 28px; font-weight: 600; letter-spacing: 0.3px; }
    #markit-splash .sub { font-size: 13px; color: #6E6A63; }
    #markit-splash .spinner {
      width: 28px; height: 28px;
      border: 3px solid #E2DED6;
      border-top-color: #274C8A;
      border-radius: 50%;
      animation: markit-spin 0.9s linear infinite;
    }
    @keyframes markit-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="markit-splash">
    <div class="wordmark">MarkIt</div>
    <div class="spinner"></div>
    <div class="sub">Loading engine…</div>
  </div>

  <script>
    // Sembunyikan splash setelah Flutter siap.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('markit-splash');
      if (el) el.classList.add('hidden');
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
